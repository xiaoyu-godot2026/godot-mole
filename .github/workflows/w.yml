name: w

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  GODOT_VERSION: 4.7.2

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP"/godot/Godot_v*
          echo "GODOT_BIN=$(ls "$RUNNER_TEMP"/godot/Godot_v*)" >> "$GITHUB_ENV"

          TPL_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$TPL_DIR/android_debug.apk" ]; then
            curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            rm -rf "$RUNNER_TEMP/tpl"
            unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/tpl"
            mkdir -p "$(dirname "$TPL_DIR")"
            rm -rf "$TPL_DIR"
            mv "$RUNNER_TEMP/tpl/templates" "$TPL_DIR"
          fi
          ls -la "$TPL_DIR" | head -30

      - name: Prepare keystore and editor settings
        run: |
          set -euxo pipefail
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
            cat > "$HOME/.config/godot/$f" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
export/android/shutdown_adb_on_exit = true
EOF
          done
          sed -i \
            -e "s|^keystore/debug=\"\"|keystore/debug=\"$GITHUB_WORKSPACE/debug.keystore\"|" \
            -e "s|^keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|" \
            -e "s|^keystore/debug_password=\"\"|keystore/debug_password=\"android\"|" \
            export_presets.cfg
          grep -n "keystore/debug" export_presets.cfg || true

      - name: Import project
        run: |
          set -euxo pipefail
          "$GODOT_BIN" --headless --path . --import || true

